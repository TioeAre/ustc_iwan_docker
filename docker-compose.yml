services:
  iwan:
    build:
      context: .
    image: ustc-iwan-client-oidc
    container_name: ustc-iwan
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.lo.disable_ipv6: "1"
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:8888:8888"
    environment:
      IWAN_PROXY_CIDR: "0.0.0.0/0"
      IWAN_HEALTHCHECK_URL: "https://api.llm.ustc.edu.cn"
      IWAN_HEALTHCHECK_TIMEOUT: "5"
      IWAN_WATCHDOG_INTERVAL: "5"
      IWAN_WATCHDOG_RETRIES: "2"
      IWAN_RECONNECT_DELAY: "2"
      IWAN_STATUS_LOG_INTERVAL: "60"
    volumes:
      - ./data/iwan:/config
